# Conda Environment for Azure ML Training
# This environment includes PyTorch, transformers, and training dependencies

name: training-env

channels:
  - conda-forge
  - pytorch
  - nvidia

dependencies:
  - python=3.11
  - pip>=23.0

  # PyTorch with CUDA support
  - pytorch::pytorch=2.1.0
  - pytorch::torchvision=0.16.0
  - pytorch::torchaudio=2.1.0
  - pytorch::pytorch-cuda=11.8

  # Core ML libraries
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0

  # System dependencies
  - conda-forge::pyyaml>=6.0

  - pip:
      # Transformers and PEFT
      - transformers>=4.57.0
      - peft>=0.18.0
      - accelerate>=0.30.0
      - bitsandbytes>=0.43.0

      # Azure ML SDK
      - azure-ai-ml>=1.17.0
      - azure-identity>=1.16.0
      - azureml-mlflow>=1.56.0

      # Training utilities
      - datasets>=2.18.0
      - evaluate>=0.4.0
      - tqdm>=4.66.0
      - tensorboard>=2.15.0

      # MLflow
      - mlflow>=2.12.0

      # Testing (for validation)
      - pytest>=9.0.0
      - pytest-cov>=7.0.0

      # Code quality
      - black>=24.0.0
      - ruff>=0.9.0
