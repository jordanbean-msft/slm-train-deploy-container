[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    -v
    --tb=short
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    azure: Tests requiring Azure resources
